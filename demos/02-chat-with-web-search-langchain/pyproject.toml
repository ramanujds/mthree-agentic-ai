[project]
name = "chat-with-web-search-langchain"
version = "0.1.0"
description = "Step 2 (LangChain variant) — the same one-tool chat app, using LangChain's native tool-calling instead of a hand-rolled text protocol (Week 2 Agentic AI series)"
requires-python = ">=3.11"
dependencies = [
    "ddgs>=9.16.0",
    "langchain-openai>=1.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
