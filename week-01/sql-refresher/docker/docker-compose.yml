services:
  postgres:
    image: pgvector/pgvector:pg16   # postgres:16 + the pgvector extension preinstalled (see note 06)
    container_name: sql-refresher-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: sql_refresher
      POSTGRES_PASSWORD: sql_refresher
      POSTGRES_DB: sql_refresher
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql   # runs once, on first container creation only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sql_refresher -d sql_refresher"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest            # lightweight web UI at http://localhost:8080, optional
    container_name: sql-refresher-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
