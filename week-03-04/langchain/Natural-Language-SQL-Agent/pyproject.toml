[project]
name = "natural-language-sql-agent"
version = "0.1.0"
description = "Natural language to SQL agent using LangChain's built-in SQL agent toolkit over a local Postgres database"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=1.6.0",
    "psycopg2-binary>=2.9.0",
    "sqlalchemy>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
