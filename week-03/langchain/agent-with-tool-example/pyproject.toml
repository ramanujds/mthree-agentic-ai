[project]
name = "agent-with-tool-example"
version = "0.1.0"
description = "Manual tool-calling calculator agent (multi-step, multi-turn) for LangChain"
requires-python = ">=3.11"
dependencies = [
    "langchain-openai>=1.6.0",
    "langchain-core>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
