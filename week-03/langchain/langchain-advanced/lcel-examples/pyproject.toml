[project]
name = "lcel-examples"
version = "0.1.0"
description = "Minimal, standalone examples illustrating LangChain LCEL patterns"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.0.0",
    "langchain-openai>=1.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
