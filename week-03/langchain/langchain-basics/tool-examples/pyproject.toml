[project]
name = "langchain-tool-examples"
version = "0.1.0"
description = "Minimal built-in vs. custom tool examples for LangChain's tool-calling flow"
requires-python = ">=3.11"
dependencies = [
    "langchain-openai>=1.6.0",
    "langchain-community>=0.3.0",
    "wikipedia>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
